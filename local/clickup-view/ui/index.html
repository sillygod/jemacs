<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page renders ClickUp's text and can change statuses and post.
       Past the sanitizer, nothing inline runs and nothing leaves: no
       inline script or handler, no fetch but to the Emacs that served
       the page to a browser.  Images are ClickUp's attachments and
       avatars, https or data:. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src https: data:; connect-src 'self'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ClickUp</title>
  <link rel="stylesheet" href="../../xwapp/ui/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <button type="button" class="mark" data-act="home" title="All spaces">CU</button>
      <nav id="crumbs" class="crumbs">ClickUp</nav>
    </div>
    <div class="actions">
      <button type="button" id="btn-back" class="ghost" hidden title="Back (Esc)">← Back</button>
      <button type="button" id="btn-refresh" class="ghost" title="Refresh (r)">Refresh</button>
      <button type="button" id="btn-copy" class="ghost" hidden>Copy link</button>
      <button type="button" id="btn-browser" class="ghost" hidden>Open in browser</button>
    </div>
  </header>
  <div id="progress" class="progress" hidden></div>
  <div id="status" class="status" hidden></div>
  <main id="app" class="app">
    <p class="muted pad">Waiting for Emacs…</p>
  </main>
  <script src="../../xwapp/ui/vendor/marked.min.js"></script>
  <script src="../../xwapp/ui/xwapp.js"></script>
  <script src="app.js"></script>
</body>
</html>
