<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <!-- The page renders text from transcripts and agents' screens, and can
       prompt and kill agents.  Past the sanitizer, nothing inline runs
       and nothing leaves: no inline script or handler, no fetch but to
       the Emacs that served the page to a browser, no remote image: an
       image only from that Emacs, or a file in the xwidget -- the copies
       of what an agent's reply named (xwapp-serve-files).  A document
       (the Docs tab, an HTML report a reply named) opens in a tab of its
       own under a policy of its own: no script, no origin, nothing from
       Emacs (xwapp-sandbox-policy). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src data: 'self' file:; connect-src 'self'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Herd</title>
  <link rel="stylesheet" href="../../xwapp/ui/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">HERD</span>
      <nav class="tabs">
        <button type="button" class="tab" data-tab="inbox">Inbox <span id="inbox-n" class="count badge"></span></button>
        <button type="button" class="tab" data-tab="agents">Agents</button>
        <button type="button" class="tab" data-tab="threads">Threads <span id="threads-n" class="count live hidden"></span></button>
        <button type="button" class="tab" data-tab="search">Search</button>
        <button type="button" class="tab" data-tab="sessions">Sessions <span id="sessions-n" class="count"></span></button>
        <button type="button" class="tab" data-tab="memory">Memory</button>
        <button type="button" class="tab" data-tab="log">Log</button>
        <button type="button" class="tab" data-tab="docs" title="HTML documents to read here: ghostherd's docs and your own">Docs</button>
      </nav>
    </div>
    <div class="actions">
      <button type="button" id="btn-back" class="ghost" hidden title="Back (Esc)">←<span class="lbl"> Back</span></button>
      <button type="button" id="btn-new" class="ghost" title="Start an agent in any project, or on a past conversation">+ New<span class="lbl"> agent</span></button>
      <!-- Wanted now and then: in the bar while it has the room, else
           behind ⋯ (style.css). -->
      <button type="button" id="btn-more" class="ghost" title="More: Phone, Import, Refresh" aria-label="More" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div id="more" class="more">
        <button type="button" class="ghost" data-xw-phone title="Open this page on your phone: its address as a QR code">Phone</button>
        <button type="button" id="btn-import" class="ghost" title="Import transcripts that changed since the last import">Import</button>
        <button type="button" id="btn-refresh" class="ghost" title="List the sessions again">Refresh</button>
      </div>
    </div>
  </header>
  <div id="status" class="status" hidden></div>
  <!-- On another device, Image picks from its photos, camera or files. -->
  <input type="file" id="image-pick" class="offscreen" accept="image/*" tabindex="-1" aria-hidden="true">
  <main id="app" class="app">
    <p class="muted pad">Waiting for Emacs…</p>
  </main>
  <script src="../../xwapp/ui/vendor/marked.min.js"></script>
  <script src="../../xwapp/ui/xwapp.js"></script>
  <script src="app.js"></script>
</body>
</html>
