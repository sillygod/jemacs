<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page renders text from transcripts and agents' screens, and can
       prompt and kill agents.  Past the sanitizer, nothing inline runs
       and nothing leaves: no inline script or handler, no fetch, no
       remote image. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Herd</title>
  <link rel="stylesheet" href="../../xwapp/ui/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">HERD</span>
      <nav class="tabs">
        <button type="button" class="tab" data-tab="agents">Agents</button>
        <button type="button" class="tab" data-tab="search">Search</button>
        <button type="button" class="tab" data-tab="sessions">Sessions <span id="sessions-n" class="count"></span></button>
        <button type="button" class="tab" data-tab="log">Log</button>
      </nav>
    </div>
    <div class="actions">
      <button type="button" id="btn-back" class="ghost" hidden title="Back (Esc)">← Back</button>
      <button type="button" id="btn-import" class="ghost" title="Import transcripts that changed since the last import">Import</button>
      <button type="button" id="btn-refresh" class="ghost" title="List the sessions again">Refresh</button>
    </div>
  </header>
  <div id="status" class="status" hidden></div>
  <main id="app" class="app">
    <p class="muted pad">Waiting for Emacs…</p>
  </main>
  <script src="../../xwapp/ui/vendor/marked.min.js"></script>
  <script src="../../xwapp/ui/xwapp.js"></script>
  <script src="app.js"></script>
</body>
</html>
